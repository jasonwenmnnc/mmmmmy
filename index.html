<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>公私記帳</title>
<style>
:root{--bg:#f5f5f4;--card:#fff;--tx:#1c1917;--mu:#78716c;--ln:#e7e5e4;--pri:#0f766e;--pri2:#ccfbf1;--co:#1d4ed8;--co2:#dbeafe;--me:#b45309;--me2:#fef3c7;--red:#dc2626;--grn:#15803d;--warn:#fef2f2;--warnt:#b91c1c;--inc:#0f766e;--ex:#d9622b}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--card:#1c1917;--tx:#f5f5f4;--mu:#a8a29e;--ln:#292524;--pri:#14b8a6;--pri2:#134e4a;--co:#93c5fd;--co2:#1e3a8a;--me:#fcd34d;--me2:#78350f;--red:#f87171;--grn:#4ade80;--warn:#450a0a;--warnt:#fca5a5;--inc:#2dd4bf;--ex:#fb923c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0}
h2{font-size:14px;margin:0 0 6px;color:var(--mu);font-weight:600}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:13px;padding:11px 0 9px}
nav button.on{color:var(--pri);font-weight:700}
#fab{position:fixed;right:18px;bottom:calc(68px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;border:0;background:var(--pri);color:#fff;font-size:32px;line-height:60px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:7}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.card.warn{background:var(--warn);color:var(--warnt)}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}
#mask.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;z-index:10;max-width:640px;margin:0 auto}
#sheet.on{transform:none}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shd b{font-size:18px}
.x{border:0;background:var(--bg);color:var(--tx);width:32px;height:32px;border-radius:16px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:16px;padding:5px 11px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:7px 0;border-radius:8px;font-size:15px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:700}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
input.big{font-size:32px;font-weight:700;text-align:right}
label.f{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-size:16px;background:var(--pri);color:#fff;width:100%;margin-top:14px}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{width:auto;padding:6px 12px;font-size:14px;margin:0}
.btn.del{background:none;color:var(--red);border:1px solid var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.row>div:first-child{min-width:0;flex:1}
.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-right:4px;vertical-align:1px}
.tag.co{background:var(--co2);color:var(--co)}.tag.me{background:var(--me2);color:var(--me)}
.tag.pd{background:var(--warn);color:var(--warnt)}.tag.ins{background:var(--pri2);color:var(--pri)}
.neg{color:var(--red)}.pos{color:var(--grn)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bign{font-size:30px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split{display:grid;grid-template-columns:76px 1fr 96px 32px;gap:6px;margin-top:6px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--tx)}
.mnav{display:flex;align-items:center;gap:8px}
.mnav button{border:0;background:var(--card);color:var(--tx);border-radius:8px;width:34px;height:34px;font-size:16px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
.bar{margin:9px 0}.bar-l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar-t{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:3px}
.bar-t i{display:block;height:100%;border-radius:4px}
i.in{background:var(--inc)}i.ex{background:var(--ex)}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--mu);margin-right:12px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tr{display:grid;grid-template-columns:40px 1fr 96px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln);font-size:14px}
.tr:last-child{border-bottom:0}.tr .bar-t{margin:2px 0}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin:4px 0 6px}.stat3 b{display:block;font-size:18px}
.hint{font-size:13px;color:var(--pri);margin-top:6px}
details summary{cursor:pointer;color:var(--mu);font-size:14px}
a{color:var(--pri)}
</style>

<body>
<header><h1 id="ttl">首頁</h1><div id="hdx"></div></header>
<main id="view"></main>
<button id="fab" aria-label="記一筆">＋</button>
<nav id="tabs">
  <button data-v="home">首頁</button><button data-v="list">明細</button><button data-v="report">報表</button><button data-v="set">設定</button>
</nav>
<div id="mask"></div>
<section id="sheet"></section>
<div id="toast"></div>
<script>
// ===== 基礎 =====
const $ = s => document.querySelector(s);
const KEY = 'bk_v1';
const LN = {co: '公司', me: '個人'};
const TYPES = {bank: '銀行', cash: '現金', wallet: '電子錢包', invest: '股票投資', card: '信用卡', loan: '貸款'};
const MKT = {TW: ['台股', 'TWD'], US: ['美股', 'USD'], JP: ['日股（手動價格）', 'JPY'], OT: ['其他（手動價格）', 'TWD']};
const TXT = {exp: '支出', inc: '收入', xfer: '轉帳', loan: '還貸款'};
const CUR = {TWD: '$', USD: 'US$', JPY: '¥'}, CURN = {TWD: '台幣', USD: '美元', JPY: '日圓'};
const FREQ = {m: '每月', q: '每季', y: '每年'};
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const isLia = a => a && (a.type === 'card' || a.type === 'loan');
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + f(x), 0);
// 金額欄可輸入簡單算式，例如 120+35
function calcRaw(v) {
  v = String(v ?? '').replace(/,/g, '').trim();
  if (!v) return 0;
  if (!/^[\d+\-*/.() ]+$/.test(v)) return NaN;
  try { const r = Function('return (' + v + ')')(); return Number.isFinite(r) ? r : NaN; } catch { return NaN; }
}
const calc = v => Math.round(calcRaw(v));
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); }

// ===== 資料 =====
function seed() {
  const a = (name, ledger, type, extra = {}) => ({id: uid(), name, ledger, type, open: 0, ...extra});
  const accounts = [
    a('個人銀行', 'me', 'bank'), a('個人現金', 'me', 'cash'), a('股票投資', 'me', 'invest'),
    a('信用卡1', 'me', 'card'), a('信用卡2', 'me', 'card'), a('信用卡3', 'me', 'card'),
    a('公司銀行A', 'co', 'bank'), a('公司銀行B', 'co', 'bank'),
    a('個人貸款1', 'me', 'loan', {rate: 0, pay: 0, day: 1}), a('個人貸款2', 'me', 'loan', {rate: 0, pay: 0, day: 1}),
    a('公司貸款', 'co', 'loan', {rate: 0, pay: 0, day: 1}),
  ];
  const c = (ledger, kind, names) => names.split(',').map(name => ({id: uid(), ledger, kind, name}));
  const cats = [
    ...c('co', 'exp', '進貨,運費,廣告,平台手續費,房租,薪資,水電網路,其他'),
    ...c('co', 'inc', '營業收入,其他收入'),
    ...c('me', 'exp', '餐飲,交通,日用品,居家,保險,醫療,娛樂,服飾,學習,孝親,稅費,其他'),
    ...c('me', 'inc', '薪資,股利,其他收入'),
    {id: uid(), ledger: 'co', kind: 'exp', name: '利息支出', sys: 'int'},
    {id: uid(), ledger: 'me', kind: 'exp', name: '貸款利息', sys: 'int'},
  ];
  return {v: 3, accounts, cats, txs: [], recs: [], holds: [], openX: 0, days: {}, skips: {}, lastBackup: null, lastAcc: {}};
}
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
let S = load() || seed();
// v1 → v2：公司分類精簡成 8 個（沒用過的舊分類隱藏，可在設定恢復）
function migrate() {
  if ((S.v || 1) < 2) {
    const ren = {'進貨成本': '進貨', '廣告費': '廣告', '佣金支出': '平台手續費', '租金支出': '房租', '薪資支出': '薪資', '水電瓦斯費': '水電網路', '什項支出': '其他'};
    const used = new Set([...S.txs.flatMap(t => (t.lines || []).map(l => l.cat)), ...S.recs.map(r => r.cat)]);
    for (const c of S.cats) {
      if (c.ledger !== 'co' || c.sys) continue;
      if (ren[c.name]) c.name = ren[c.name];
      else if (!['運費', '營業收入', '其他收入'].includes(c.name) && !used.has(c.id)) c.hide = true;
    }
    S.v = 2;
  }
  // v2 → v3：加入股票投資帳戶與持股清單
  if (S.v < 3) {
    if (!S.accounts.some(a => a.type === 'invest')) S.accounts.push({id: uid(), name: '股票投資', ledger: 'me', type: 'invest', open: 0});
    S.v = 3;
  }
  S.holds = S.holds || [];
}
migrate();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert('儲存失敗：' + e.message + '\n請立刻到「設定 → 匯出備份」'); }
}
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// 匯率：每天第一次開啟時抓一次（台幣計價），失敗就沿用上次的
async function fetchFx(force) {
  if (!force && S.fx && S.fx.date === today()) return false;
  const srcs = [
    async () => { const d = await (await fetch('https://open.er-api.com/v6/latest/TWD')).json(); return {USD: 1 / d.rates.USD, JPY: 1 / d.rates.JPY}; },
    async () => { const d = await (await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.json')).json(); return {USD: 1 / d.twd.usd, JPY: 1 / d.twd.jpy}; },
  ];
  for (const src of srcs) {
    try {
      const r = await src();
      if (r.USD > 0 && r.JPY > 0 && Number.isFinite(r.USD) && Number.isFinite(r.JPY)) {
        S.fx = {date: today(), USD: Math.round(r.USD * 1000) / 1000, JPY: Math.round(r.JPY * 10000) / 10000}; save(); return true;
      }
    } catch {}
  }
  return false;
}
const fxText = t => t.cur && t.cur !== 'TWD' ? `${CUR[t.cur]}${t.famt} × ${t.rate}` : '';
const acc = id => S.accounts.find(a => a.id === id);
const cat = id => S.cats.find(c => c.id === id);
const intCat = L => S.cats.find(c => c.ledger === L && c.sys === 'int');
const liveAccs = f => S.accounts.filter(a => !a.hide && (!f || f(a)));

// ===== 複式分錄引擎（不儲存，一律由交易即時推算）=====
// 科目代號：A:帳戶  C:分類  U:待分類  X:co 股東往來（公司帳）  X:me 公司往來（個人帳）  E:期初淨值
// 「公司欠你」= 個人帳 X:me 的借方餘額 = 公司帳 X:co 的貸方餘額
function jl(t) {
  const out = [], A = acc(t.acc);
  if (!A) return out;
  const LA = A.ledger, AK = 'A:' + A.id;
  const P = (L, k, dr, cr) => out.push({L, k, dr, cr});
  if (t.type === 'exp' || t.type === 'inc') {
    let cross = 0;
    for (const ln of t.lines) {
      const ck = ln.cat ? 'C:' + ln.cat : 'U:' + ln.ledger + ':' + t.type;
      const src = ln.ledger === LA ? AK : 'X:' + ln.ledger;
      if (t.type === 'exp') { P(ln.ledger, ck, ln.amt, 0); P(ln.ledger, src, 0, ln.amt); }
      else { P(ln.ledger, src, ln.amt, 0); P(ln.ledger, ck, 0, ln.amt); }
      if (ln.ledger !== LA) cross += ln.amt;
    }
    if (cross) {
      if (t.type === 'exp') { P(LA, 'X:' + LA, cross, 0); P(LA, AK, 0, cross); }
      else { P(LA, AK, cross, 0); P(LA, 'X:' + LA, 0, cross); }
    }
  } else if (t.type === 'xfer') {
    const B = acc(t.to); if (!B) return out;
    if (B.ledger === LA) { P(LA, 'A:' + B.id, t.amt, 0); P(LA, AK, 0, t.amt); }
    else { P(LA, 'X:' + LA, t.amt, 0); P(LA, AK, 0, t.amt); P(B.ledger, 'A:' + B.id, t.amt, 0); P(B.ledger, 'X:' + B.ledger, 0, t.amt); }
  } else if (t.type === 'loan') {
    const Lo = acc(t.loan); if (!Lo) return out;
    const LL = Lo.ledger, src = LL === LA ? AK : 'X:' + LL;
    if (t.prin) P(LL, 'A:' + Lo.id, t.prin, 0);
    if (t.int) P(LL, 'C:' + intCat(LL).id, t.int, 0);
    P(LL, src, 0, t.amt);
    if (LL !== LA) { P(LA, 'X:' + LA, t.amt, 0); P(LA, AK, 0, t.amt); }
  }
  return out;
}
function opening() {
  const o = [];
  for (const a of S.accounts) {
    const v = +a.open || 0; if (!v) continue;
    if (isLia(a)) o.push({L: a.ledger, k: 'A:' + a.id, dr: 0, cr: v}, {L: a.ledger, k: 'E:' + a.ledger, dr: v, cr: 0});
    else o.push({L: a.ledger, k: 'A:' + a.id, dr: v, cr: 0}, {L: a.ledger, k: 'E:' + a.ledger, dr: 0, cr: v});
  }
  const x = +S.openX || 0;
  if (x) o.push({L: 'me', k: 'X:me', dr: x, cr: 0}, {L: 'me', k: 'E:me', dr: 0, cr: x}, {L: 'co', k: 'E:co', dr: x, cr: 0}, {L: 'co', k: 'X:co', dr: 0, cr: x});
  return o;
}
// 各科目餘額（借減貸），可指定截止日 upto
function balances(upto) {
  const m = {};
  const add = l => m[l.k] = (m[l.k] || 0) + l.dr - l.cr;
  opening().forEach(add);
  for (const t of S.txs) if (!upto || t.date <= upto) jl(t).forEach(add);
  return m;
}
const accBal = (a, m) => isLia(a) ? -(m['A:' + a.id] || 0) : (m['A:' + a.id] || 0);
// 股票：市值 = 股數 × 價格 × 匯率；投資帳戶的「帳面餘額」是投入淨額（買進減賣出）
const fxOf = c => !c || c === 'TWD' ? 1 : (S.fx?.[c] || 0);
const holdVal = h => Math.round((+h.shares || 0) * (+h.price || 0) * fxOf(h.cur));
const invVal = a => sum(S.holds.filter(h => h.acc === a.id), holdVal);
const accVal = (a, m) => a.type === 'invest' ? invVal(a) : accBal(a, m);
// 某帳本的資產負債；公私往來也算進去（個人：公司欠你＝資產；公司：欠老闆＝負債）
function sheetOf(L, m) {
  const assets = [], debts = [];
  for (const a of S.accounts.filter(a => a.ledger === L)) {
    const v = accVal(a, m); if (!Math.round(v)) continue;
    (isLia(a) ? debts : assets).push([a.name + (a.type === 'invest' ? '（市值）' : ''), v]);
  }
  const x = m['X:me'] || 0;
  if (Math.round(x)) {
    if (L === 'me') (x > 0 ? assets : debts).push([x > 0 ? '公司欠你' : '你欠公司', Math.abs(x)]);
    else (x > 0 ? debts : assets).push([x > 0 ? '欠老闆（公私往來）' : '老闆欠公司（公私往來）', Math.abs(x)]);
  }
  const A = sum(assets, r => r[1]), D = sum(debts, r => r[1]);
  return {assets, debts, A, D, net: A - D, x: Math.abs(x)};
}
// 股價：FinMind 免費 API（台股、美股收盤價），每天每檔抓一次
async function fetchPrices(force) {
  const start = ymd(new Date(Date.now() - 14 * 864e5)); let n = 0;
  for (const h of S.holds) {
    if (!['TW', 'US'].includes(h.mkt) || !h.sym || (!force && h.chk === today())) continue;
    try {
      const ds = h.mkt === 'TW' ? 'TaiwanStockPrice' : 'USStockPrice';
      const j = await (await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=${ds}&data_id=${encodeURIComponent(h.sym.trim().toUpperCase())}&start_date=${start}`)).json();
      const last = j.data?.[j.data.length - 1], px = last && (last.close ?? last.Close);
      if (px > 0) { h.price = px; h.pdate = last.date; h.chk = today(); n++; }
    } catch {}
  }
  if (n) save();
  return n;
}
function keyName(k) {
  const [p, id] = k.split(':');
  if (p === 'A') return acc(id)?.name || '(已刪帳戶)';
  if (p === 'C') return cat(id)?.name || '(已刪分類)';
  if (p === 'X') return id === 'co' ? '股東往來' : '公司往來';
  if (p === 'E') return '期初淨值';
  if (p === 'U') return k.endsWith('exp') ? '待分類支出' : '待分類收入';
  return k;
}
const isPending = t => (t.type === 'exp' || t.type === 'inc') && t.lines.some(l => !l.cat);
function txTitle(t) {
  if (t.type === 'xfer') return (acc(t.acc)?.name || '?') + ' → ' + (acc(t.to)?.name || '?');
  if (t.type === 'loan') return '還款・' + (acc(t.loan)?.name || '?');
  return t.lines.map(l => l.cat ? cat(l.cat)?.name : '待分類').join('、');
}
function txLedgers(t) { return [...new Set(jl(t).map(l => l.L))]; }

// ===== 到期提醒（貸款＋定期／保險）=====
function dueItems() {
  const now = new Date(), lim = ymd(new Date(Date.now() + 7 * 864e5)), old = ymd(new Date(Date.now() - 45 * 864e5));
  const done = new Set(S.txs.filter(x => x.ref).map(x => x.ref));
  // 手動記的貸款還款也算該月已繳
  for (const x of S.txs) if (x.type === 'loan') done.add('L' + x.loan + '@' + x.date.slice(0, 7));
  const out = [];
  const chk = (id, kind, obj, freq, day, month, start) => {
    const cands = [];
    if (freq === 'y') {
      for (let k = -1; k <= 1; k++) { const y = now.getFullYear() + k, dim = new Date(y, month, 0).getDate(); cands.push([String(y), ymd(new Date(y, month - 1, Math.min(day, dim)))]); }
    } else {
      const span = freq === 'q' ? 3 : 1;
      for (let k = -span; k <= span; k++) {
        const d = new Date(now.getFullYear(), now.getMonth() + k, 1);
        if (freq === 'q' && ((d.getMonth() - (month - 1)) % 3 + 3) % 3) continue; // 每季：只取起始月起每 3 個月
        const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        cands.push([d.getFullYear() + '-' + pad(d.getMonth() + 1), ymd(new Date(d.getFullYear(), d.getMonth(), Math.min(day, dim)))]);
      }
    }
    for (const [p, dd] of cands) {
      const ref = id + '@' + p;
      if (dd < old || dd > lim || (start && dd < start) || done.has(ref) || S.skips[ref]) continue;
      out.push({ref, kind, obj, due: dd});
    }
  };
  for (const a of S.accounts) if (a.type === 'loan' && +a.pay > 0 && !a.hide) chk('L' + a.id, 'loan', a, 'm', +a.day || 1, 0, a.start);
  for (const r of S.recs) if (!r.off) chk('R' + r.id, 'rec', r, r.freq, +r.day || 1, +r.month || 1, r.start);
  return out.sort((x, y) => x.due < y.due ? -1 : 1);
}
function loanSplit(a, total) {
  const owed = accBal(a, balances());
  let it = Math.round(Math.max(0, owed) * (+a.rate || 0) / 1200);
  if (it > total) it = total;
  return {prin: total - it, int: it};
}
function streak() {
  const d = new Date(); if (!S.days[ymd(d)]) d.setDate(d.getDate() - 1);
  let n = 0; while (S.days[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// 某月某帳本：收入、支出（依分類），以及還貸款本金（不算花費）
function monthFlow(L, mm) {
  const inc = {}, exp = {}; let prin = 0;
  for (const t of S.txs) {
    if (!t.date.startsWith(mm)) continue;
    if (t.type === 'loan' && acc(t.loan)?.ledger === L) prin += t.prin || 0;
    for (const l of jl(t)) {
      if (l.L !== L || !(l.k[0] === 'C' || l.k[0] === 'U')) continue;
      const kd = l.k[0] === 'U' ? (l.k.endsWith('exp') ? 'exp' : 'inc') : cat(l.k.slice(2))?.kind;
      if (kd === 'exp') exp[l.k] = (exp[l.k] || 0) + l.dr - l.cr;
      else inc[l.k] = (inc[l.k] || 0) + l.cr - l.dr;
    }
  }
  return {inc, exp, ti: sum(Object.values(inc)), te: sum(Object.values(exp)), prin};
}
function bars(m, total, cls) {
  const ks = Object.keys(m).filter(k => Math.round(m[k])).sort((a, b) => m[b] - m[a]);
  if (!ks.length) return '<div class="mu">沒有紀錄</div>';
  return ks.map(k => {
    const p = total > 0 ? m[k] / total * 100 : 0;
    return `<div class="bar"><div class="bar-l"><span>${esc(keyName(k))}</span><span class="num">${money(m[k])}<span class="mu"> ${Math.round(p)}%</span></span></div><div class="bar-t"><i class="${cls}" style="width:${Math.max(0, Math.min(100, p))}%"></i></div></div>`;
  }).join('');
}

function readTrade() { if (!TR || !$('#tShares')) return; TR.shares = $('#tShares').value; TR.amt = $('#tAmt').value; TR.date = $('#tDate').value; }
function saveTrade(id) {
  readTrade();
  const x = S.holds.find(h => h.id === id), sh = calcRaw(TR.shares), amt = calc(TR.amt);
  if (!(sh > 0)) return toast('請填股數'); if (!(amt > 0)) return toast('請填金額'); if (!acc(TR.acc)) return toast('請選帳戶');
  if (TR.side === 'sell' && sh > (+x.shares || 0)) return toast('賣出股數超過持有');
  x.shares = Math.round(((+x.shares || 0) + (TR.side === 'buy' ? sh : -sh)) * 10000) / 10000;
  const inv = x.acc, bank = TR.acc;
  S.txs.push({id: uid(), type: 'xfer', date: TR.date || today(), acc: TR.side === 'buy' ? bank : inv, to: TR.side === 'buy' ? inv : bank, amt, note: `${TR.side === 'buy' ? '買進' : '賣出'} ${x.sym} ${sh} 股`, created: Date.now()});
  S.lastAcc.trade = bank; S.days[today()] = 1; TR = null;
  save(); closeSheet(); render(); toast('已記錄');
}

const seg = (act, opts, val) => `<div class="seg">${opts.map(([k, n]) => `<button data-a="${act}" data-k="${k}" class="${val === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;

// ----- 記帳表單 -----
let F = null;
const formAccs = () => liveAccs(a => a.type !== 'loan');
function openTx(tx, preset) {
  if (tx) F = JSON.parse(JSON.stringify(tx));
  else {
    const t = preset?.type || 'exp';
    const a0 = acc(S.lastAcc[t]) && !acc(S.lastAcc[t]).hide ? S.lastAcc[t] : formAccs()[0]?.id;
    F = {type: t, cur: 'TWD', rate: '', twd: '', amt: '', acc: a0, to: '', loan: '', prin: '', int: '', lines: [{ledger: acc(a0)?.ledger || 'me', cat: '', amt: 0, inv: false}], date: today(), note: '', ...preset};
  }
  F.lines = F.lines || [{ledger: acc(F.acc)?.ledger || 'me', cat: '', amt: 0, inv: false}];
  if (tx && F.lines.length > 1) { F.lines = F.lines.map((l, i) => ({...l, amt: i ? l.amt : 0})); }
  F.edit = !!tx; F.manual = !!tx || !!preset?.lines;
  F.cur = F.cur || 'TWD';
  F.amt = tx ? String(F.cur !== 'TWD' ? tx.famt : tx.amt) : String(F.amt || '');
  if (tx && F.cur !== 'TWD') { F.twd = String(tx.amt); F.rate = String(tx.rate); }
  if (tx && tx.type === 'loan') { F.prin = String(tx.prin); F.int = String(tx.int); }
  renderForm();
  if (!tx && F.type !== 'loan') $('#fAmt').focus();
}
function readForm() {
  if (!F) return;
  const v = id => document.getElementById(id)?.value;
  if (v('fAmt') !== undefined) F.amt = v('fAmt');
  if (v('fDate') !== undefined) F.date = v('fDate');
  if (v('fNote') !== undefined) F.note = v('fNote');
  if (v('fPrin') !== undefined) F.prin = v('fPrin');
  if (v('fInt') !== undefined) F.int = v('fInt');
  if (v('fRate') !== undefined) F.rate = v('fRate');
  if (v('fTwd') !== undefined) F.twd = v('fTwd');
  F.lines.forEach((l, i) => { if (i && v('sA' + i) !== undefined) l.amt = v('sA' + i); });
}
const isFx = () => F.type !== 'loan' && F.cur && F.cur !== 'TWD';
// 表單的台幣總額（外幣 = 台幣金額欄，沒填就用 外幣×匯率）
function twdTotal() {
  if (!isFx()) return calc(F.amt);
  const v = calc(F.twd);
  return v > 0 ? v : Math.round((calcRaw(F.amt) || 0) * (parseFloat(F.rate) || 0));
}
function draftTx() {
  const total = twdTotal();
  const t = {type: F.type, acc: F.acc, to: F.to, amt: total, date: F.date};
  if (F.type === 'exp' || F.type === 'inc') {
    const extra = F.lines.slice(1).map(l => ({...l, amt: calc(l.amt)})).filter(l => l.amt > 0);
    t.lines = [{ledger: F.lines[0].ledger, cat: F.lines[0].cat, amt: total - sum(extra, l => l.amt), inv: !!F.lines[0].inv}, ...extra].filter(l => l.amt > 0);
  }
  if (F.type === 'loan') { t.loan = F.loan; t.prin = calc(F.prin) || 0; t.int = calc(F.int) || 0; }
  return t;
}
function crossHint() {
  const total = twdTotal(); if (!(total > 0) || !acc(F.acc)) return '';
  if (F.type === 'xfer' && !acc(F.to)) return '';
  if (F.type === 'loan' && !acc(F.loan)) return '';
  const d = sum(jl(draftTx()).filter(l => l.k === 'X:me'), l => l.dr - l.cr);
  if (!d) return '';
  return `<div class="hint">↳ 跨公私：${d > 0 ? `公司欠你 +${money(d)}` : `公司欠你 −${money(-d)}（或你欠公司增加）`}</div>`;
}
function renderForm() {
  const t = F.type, L0 = F.lines[0].ledger;
  let h = `<div class="shd"><b>${F.edit ? '編輯紀錄' : '記一筆'}</b><button class="x" data-a="close">✕</button></div>`;
  h += seg('fType', Object.entries(TXT), t);
  if (t !== 'loan') h += `<div style="margin-top:10px">${seg('fCur', Object.entries(CURN), F.cur)}</div>`;
  h += `<label class="f">金額${isFx() ? '（' + CURN[F.cur] + '）' : ''}（可輸入算式，如 120+35）</label><input id="fAmt" class="big" inputmode="decimal" autocomplete="off" value="${esc(F.amt)}" placeholder="0">`;
  if (isFx()) h += `<div class="grid2"><div><label class="f">匯率（1 ${CURN[F.cur]} = ? 台幣）</label><input id="fRate" inputmode="decimal" value="${esc(F.rate)}"></div><div><label class="f">台幣金額</label><input id="fTwd" inputmode="decimal" value="${esc(F.twd)}"></div></div>
    <div class="mu" style="margin-top:4px">${S.fx ? `網路匯率（${S.fx.date}）。刷卡實際扣款以帳單為準，可以直接改台幣金額。` : '還沒抓到網路匯率，請手動填匯率。'}</div>`;
  const accList = formAccs().filter(a => t === 'xfer' || a.type !== 'invest').map(a => [a.id, a.name]);
  if (t === 'exp' || t === 'inc') {
    h += `<label class="f">${t === 'exp' ? '從哪個帳戶付' : '收到哪個帳戶'}</label>${chips('fAcc', accList, F.acc)}`;
    h += `<label class="f">這筆屬於</label>${seg('fLed', [['co', '公司'], ['me', '個人']], L0)}`;
    const cs = S.cats.filter(c => c.ledger === L0 && c.kind === t && !c.hide && !c.sys).map(c => [c.id, c.name]);
    h += `<label class="f">分類（可先不選，之後再整理）</label>${chips('fCat', cs, F.lines[0].cat)}`;
    F.lines.forEach((l, i) => {
      if (!i) return;
      const cs2 = S.cats.filter(c => c.ledger === l.ledger && c.kind === t && !c.hide && !c.sys);
      h += `<div class="split"><select data-s="led" data-i="${i}">${['co', 'me'].map(L => `<option value="${L}" ${l.ledger === L ? 'selected' : ''}>${LN[L]}</option>`).join('')}</select>
        <select data-s="cat" data-i="${i}"><option value="">待分類</option>${cs2.map(c => `<option value="${c.id}" ${l.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
        <input id="sA${i}" inputmode="decimal" value="${esc(l.amt || '')}" placeholder="金額"><button class="x" data-a="sDel" data-i="${i}">✕</button></div>`;
    });
    if (F.lines.length > 1) h += `<div class="mu" style="margin-top:4px">拆帳金額都用台幣。上方分類分到的金額＝總額扣掉拆出去的：<span id="fRest">${money(twdTotal() - sum(F.lines.slice(1), l => calc(l.amt) || 0))}</span></div>`;
    h += `<button class="btn sec sm" style="margin-top:10px" data-a="sAdd">＋ 拆帳（一張單據有公有私）</button>`;
  } else if (t === 'xfer') {

  } else {
    const loans = liveAccs(a => a.type === 'loan').map(a => [a.id, a.name]);
    h += `<label class="f">哪一筆貸款</label>${loans.length ? chips('fLoan', loans, F.loan) : '<div class="mu">請先到設定新增貸款</div>'}`;
    h += `<label class="f">從哪個帳戶扣款</label>${chips('fAcc', accList, F.acc)}`;
    h += `<div class="grid2"><div><label class="f">本金</label><input id="fPrin" inputmode="decimal" value="${esc(F.prin)}"></div><div><label class="f">利息（自動估算，可改）</label><input id="fInt" inputmode="decimal" value="${esc(F.int)}"></div></div>`;
  }
  h += `<div id="fHint">${crossHint()}</div>`;
  h += `<div class="grid2"><div><label class="f">日期</label><input id="fDate" type="date" value="${esc(F.date)}"></div><div><label class="f">備註</label><input id="fNote" value="${esc(F.note)}" placeholder="選填"></div></div>`;
  h += `<button class="btn" data-a="fSave">儲存</button>`;
  if (F.edit) h += `<button class="btn del" data-a="fDel">刪除這筆</button>`;
  showSheet(h);
}
function reloanSplit(fromInt) {
  const a = acc(F.loan), total = calc(F.amt);
  if (!a || !(total > 0)) return;
  if (fromInt) F.prin = String(total - (calc(F.int) || 0));
  else { const s = loanSplit(a, total); F.prin = String(s.prin); F.int = String(s.int); }
  $('#fPrin').value = F.prin; $('#fInt').value = F.int;
}
$('#sheet').addEventListener('input', e => {
  if (!F) return;
  readForm();
  if (e.target.id === 'fAmt' && F.type === 'loan') reloanSplit(false);
  if (e.target.id === 'fInt') reloanSplit(true);
  if (isFx()) {
    const fa = calcRaw(F.amt) || 0;
    if (e.target.id === 'fAmt' || e.target.id === 'fRate') { F.twd = fa && parseFloat(F.rate) ? String(Math.round(fa * parseFloat(F.rate))) : ''; $('#fTwd').value = F.twd; }
    if (e.target.id === 'fTwd' && fa > 0 && calc(F.twd) > 0) { F.rate = String(Math.round(calc(F.twd) / fa * 10000) / 10000); $('#fRate').value = F.rate; }
  }
  const hint = $('#fHint'); if (hint) hint.innerHTML = crossHint();
  const rest = $('#fRest'); if (rest) rest.textContent = money(twdTotal() - sum(F.lines.slice(1), l => calc(l.amt) || 0));
});
$('#sheet').addEventListener('change', e => {
  if (!F) return;
  const s = e.target.dataset.s, i = +e.target.dataset.i;
  if (!s) return;
  readForm();
  if (s === 'led') { F.lines[i].ledger = e.target.value; F.lines[i].cat = ''; }
  if (s === 'cat') F.lines[i].cat = e.target.value;
  renderForm();
});
function saveTx() {
  readForm();
  const total = twdTotal();
  if (isFx() && !(calcRaw(F.amt) > 0)) return toast('請輸入正確的外幣金額');
  if (!(total > 0)) return toast(isFx() ? '請填匯率或台幣金額' : '請輸入正確金額');
  if (!acc(F.acc)) return toast('請選帳戶');
  const t = {id: F.id || uid(), type: F.type, date: F.date || today(), acc: F.acc, amt: total, note: (F.note || '').trim(), created: F.created || Date.now()};
  if (F.ref) t.ref = F.ref;
  if (isFx()) { t.cur = F.cur; t.famt = Math.round(calcRaw(F.amt) * 100) / 100; t.rate = Math.round(total / t.famt * 10000) / 10000; }
  if (F.type === 'exp' || F.type === 'inc') {
    const d = draftTx();
    const rest = total - sum(F.lines.slice(1), l => calc(l.amt) || 0);
    if (rest < 0) return toast('拆帳金額超過總額');
    t.lines = d.lines;
  } else if (F.type === 'xfer') {
    if (!acc(F.to) || F.to === F.acc) return toast('請選轉入帳戶');
    t.to = F.to;
  } else {
    if (!acc(F.loan)) return toast('請選貸款');
    t.loan = F.loan; t.prin = calc(F.prin) || 0; t.int = calc(F.int) || 0;
    if (t.prin < 0 || t.int < 0 || t.prin + t.int !== total) return toast('本金＋利息要等於金額');
  }
  const i = S.txs.findIndex(x => x.id === t.id);
  if (i >= 0) S.txs[i] = t; else S.txs.push(t);
  S.lastAcc[t.type] = t.acc; S.days[today()] = 1;
  save(); closeSheet(); render(); toast(i >= 0 ? '已更新' : '已記帳 ✓');
}

      <div><label class="f">每月扣款日</label><input id="aDay" inputmode="numeric" value="${+a.day || 1}"></div>
      <div><label class="f">扣款帳戶</label><select id="aPayAcc">${bankList.map(x => `<option value="${x.id}" ${a.payAcc === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div></div>
      <label class="f">從哪天開始提醒（之前的還款已含在欠款裡）</label><input id="aStart" type="date" value="${esc(a.start || today())}">
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="aHide" ${a.hide ? 'checked' : ''}> 隱藏（不再使用，但保留歷史紀錄）</label>
    <button class="btn" data-a="accSave" data-id="${a.id}">儲存</button>
    ${!n && !used ? `<button class="btn del" data-a="accDel" data-id="${a.id}">刪除帳戶</button>` : ''}
    ${used ? '<div class="mu" style="margin-top:8px">此帳戶已有交易，無法刪除或改類型；不用了可勾選隱藏。</div>' : ''}`;
  showSheet(h);
  $('#aType').onchange = e => { $('#loanF').style.display = e.target.value === 'loan' ? 'block' : 'none'; $('#aOpenL').textContent = openLabel(e.target.value); };
}
function saveAcc(id) {
  const name = $('#aName').value.trim(); if (!name) return toast('請填名稱');
  const o = id ? acc(id) : {id: uid()};
  const open = calc($('#aOpen').value); if (Number.isNaN(open)) return toast('金額格式錯誤');
  Object.assign(o, {name, ledger: $('#aLed').value, type: $('#aType').value, open, hide: $('#aHide').checked});
  if (o.type === 'loan') Object.assign(o, {rate: parseFloat($('#aRate').value) || 0, pay: calc($('#aPay').value) || 0, day: Math.min(31, Math.max(1, parseInt($('#aDay').value) || 1)), payAcc: $('#aPayAcc').value, start: $('#aStart').value});
  if (!id) S.accounts.push(o);
  save(); closeSheet(); render(); toast('已儲存');
}

// ----- 定期／保險表單 -----
function openRec(r) {
  const n = !r; r = r || {id: '', name: '', ledger: 'me', cur: 'TWD', amt: '', acc: formAccs()[0]?.id, cat: '', freq: 'm', day: 1, month: 1, ins: false, start: today()};
  const cats = S.cats.filter(c => c.kind === 'exp' && !c.sys && !c.hide);
  let h = `<div class="shd"><b>${n ? '新增定期支出' : '編輯定期支出'}</b><button class="x" data-a="close">✕</button></div>
    <label class="f">名稱</label><input id="rName" value="${esc(r.name)}" placeholder="例：國泰壽險、辦公室房租">
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="rIns" ${r.ins ? 'checked' : ''}> 這是保險</label>
    <div class="grid2"><div><label class="f">屬於</label><select id="rLed">${['co', 'me'].map(L => `<option value="${L}" ${r.ledger === L ? 'selected' : ''}>${LN[L]}</option>`).join('')}</select></div>
    <div><label class="f">金額</label><div style="display:flex;gap:4px"><select id="rCur" style="width:92px;flex:none">${Object.entries(CURN).map(([k, n]) => `<option value="${k}" ${(r.cur || 'TWD') === k ? 'selected' : ''}>${n}</option>`).join('')}</select><input id="rAmt" inputmode="decimal" value="${esc(r.amt)}"></div></div>
    <div><label class="f">扣款帳戶</label><select id="rAcc">${formAccs().map(a => `<option value="${a.id}" ${r.acc === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
    <div><label class="f">分類</label><select id="rCat">${cats.map(c => `<option value="${c.id}" data-l="${c.ledger}" ${r.cat === c.id ? 'selected' : ''}>${LN[c.ledger]}・${esc(c.name)}</option>`).join('')}</select></div>
    <div><label class="f">頻率</label><select id="rFreq">${Object.entries(FREQ).map(([k, n]) => `<option value="${k}" ${r.freq === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div><label class="f">月份（每年＝扣款月；每季＝第一次扣款月）</label><input id="rMonth" inputmode="numeric" value="${+r.month || 1}"></div>
    <div><label class="f">日</label><input id="rDay" inputmode="numeric" value="${+r.day || 1}"></div>
    <div><label class="f">從哪天開始</label><input id="rStart" type="date" value="${esc(r.start || today())}"></div></div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="rOff" ${r.off ? 'checked' : ''}> 停用</label>
    <button class="btn" data-a="recSave" data-id="${r.id}">儲存</button>
    ${n ? '' : `<button class="btn del" data-a="recDel" data-id="${r.id}">刪除</button>`}`;
  showSheet(h);
  const sync = () => { const L = $('#rLed').value; [...$('#rCat').options].forEach(o => o.hidden = o.dataset.l !== L); if ($('#rCat').selectedOptions[0]?.hidden) $('#rCat').value = [...$('#rCat').options].find(o => !o.hidden)?.value || ''; };
  $('#rLed').onchange = sync; sync();
}
function saveRec(id) {
  const rc = $('#rCur').value, ra = calcRaw($('#rAmt').value), name = $('#rName').value.trim();
  const amt = rc === 'TWD' ? Math.round(ra) : Math.round(ra * 100) / 100;
  if (!name) return toast('請填名稱'); if (!(amt > 0)) return toast('請填金額');
  const o = id ? S.recs.find(r => r.id === id) : {id: uid()};
  Object.assign(o, {name, ins: $('#rIns').checked, ledger: $('#rLed').value, cur: rc, amt, acc: $('#rAcc').value, cat: $('#rCat').value, freq: $('#rFreq').value,
    month: Math.min(12, Math.max(1, parseInt($('#rMonth').value) || 1)), day: Math.min(31, Math.max(1, parseInt($('#rDay').value) || 1)), start: $('#rStart').value, off: $('#rOff').checked});
  if (!id) S.recs.push(o);
  save(); closeSheet(); render(); toast('已儲存');
}

// ----- 備份 -----
async function exportData() {
  const name = '記帳備份_' + today() + '.json';
  const blob = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'});
  const file = new File([blob], name, {type: 'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) await navigator.share({files: [file], title: name});
    else { const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(u), 3000); }
    S.lastBackup = Date.now(); save(); render(); toast('已匯出');
  } catch (e) { if (e.name !== 'AbortError') alert('匯出失敗：' + e.message); }
}
function importData(f) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.accounts) || !Array.isArray(d.txs) || !Array.isArray(d.cats)) throw new Error('不是這個 App 的備份檔');
      if (!confirm(`備份檔有 ${d.txs.length} 筆交易。\n匯入會「取代」目前手機上的全部資料（目前 ${S.txs.length} 筆），確定？`)) return;
      S = Object.assign(seed(), d); save(); render(); toast('已匯入');
    } catch (e) { alert('匯入失敗：' + e.message); }
  };
  r.readAsText(f);
}

// ===== 點擊事件（統一處理）=====
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, k = el.dataset.k, id = el.dataset.id;
  if (F) readForm();
  switch (a) {
    case 'close': return closeSheet();
    case 'm-': shiftMonth(-1); return render();
    case 'm+': shiftMonth(1); return render();
    case 'lf': listF = k; return render();
    case 'rt': repTab = k; return render();
    case 'nospend': S.days[today()] = 1; save(); render(); return toast('打卡完成 ✓');
    case 'gopend': cur = 'list'; listF = 'pend'; return render();
    case 'gobackup': cur = 'set'; render(); return setTimeout(() => $('[data-a=export]')?.scrollIntoView({block: 'center'}), 50);
    case 'edit': { const t = S.txs.find(x => x.id === id); if (t) openTx(t); return; }
    case 'skip': if (confirm('略過這一期，不記帳？')) { S.skips[el.dataset.ref] = 1; save(); render(); } return;
    case 'due': {
      const d = dueItems().find(x => x.ref === el.dataset.ref); if (!d) return;
      const o = d.obj;
      if (d.kind === 'loan') {
        const s = loanSplit(o, +o.pay);
        openTx(null, {type: 'loan', loan: o.id, acc: acc(o.payAcc) ? o.payAcc : formAccs()[0]?.id, amt: o.pay, prin: String(s.prin), int: String(s.int), date: d.due, ref: d.ref, note: ''});
      } else if (o.cur && o.cur !== 'TWD') {
        const rate = S.fx?.[o.cur] || '';
        openTx(null, {type: 'exp', cur: o.cur, rate: String(rate), twd: rate ? String(Math.round(o.amt * rate)) : '', acc: o.acc, amt: o.amt, lines: [{ledger: o.ledger, cat: o.cat, amt: 0, inv: false}], date: d.due, ref: d.ref, note: o.name});
      } else openTx(null, {type: 'exp', acc: o.acc, amt: o.amt, lines: [{ledger: o.ledger, cat: o.cat, amt: 0, inv: false}], date: d.due, ref: d.ref, note: o.name});
      return;
    }
    // 記帳表單
    case 'fCur': {
      F.cur = k;
      if (k !== 'TWD') {
        F.rate = String(S.fx?.[k] || ''); const fa = calcRaw(F.amt) || 0; F.twd = fa && F.rate ? String(Math.round(fa * F.rate)) : '';
        fetchFx().then(ok => { if (ok && F && F.cur === k) { F.rate = String(S.fx[k]); const fa2 = calcRaw(F.amt) || 0; F.twd = fa2 ? String(Math.round(fa2 * S.fx[k])) : ''; renderForm(); } });
      }
      return renderForm();
    }
    case 'gobs': cur = 'report'; repTab = 'bs'; render(); return scrollTo(0, 0);
    case 'holdNew': return openHold();
    case 'holdEdit': return openHold(S.holds.find(h => h.id === id));
    case 'holdSave': return saveHold(id);
    case 'holdDel': if (confirm('刪除這檔持股？（已記的買賣轉帳不受影響）')) { S.holds = S.holds.filter(h => h.id !== id); save(); closeSheet(); render(); } return;
    case 'trade': e.stopPropagation(); TR = null; return openTrade(S.holds.find(h => h.id === id));
    case 'trSide': readTrade(); TR.side = k; return openTrade(S.holds.find(h => h.id === TR.id));
    case 'trAcc': readTrade(); TR.acc = k; return openTrade(S.holds.find(h => h.id === TR.id));
    case 'trSave': return saveTrade(id);
    case 'pxNow': toast('更新中…'); fetchPrices(true).then(n => { render(); toast(n ? `已更新 ${n} 檔` : '沒有可自動更新的持股，或網路／代號有問題'); }); return;
    case 'fxNow': fetchFx(true).then(ok => { render(); toast(ok ? '匯率已更新' : '更新失敗，請確認網路'); }); return;
    case 'fType': if (k === 'loan') F.cur = 'TWD'; F.type = k; if (k === 'loan' && !F.loan) { const l = liveAccs(x => x.type === 'loan')[0]; if (l) { F.loan = l.id; if (acc(l.payAcc)) F.acc = l.payAcc; if (!F.amt && l.pay) F.amt = String(l.pay); } } if (k === 'loan') { const l = acc(F.loan); const tt = calc(F.amt); if (l && tt > 0) { const s = loanSplit(l, tt); F.prin = String(s.prin); F.int = String(s.int); } } return renderForm();
    case 'fAcc': F.acc = k; if (!F.manual && F.lines) { F.lines[0].ledger = acc(k).ledger; F.lines[0].cat = ''; } return renderForm();
    case 'fTo': F.to = k; return renderForm();
    case 'fLed': if (F.lines[0].ledger !== k) { F.lines[0].ledger = k; F.lines[0].cat = ''; } F.manual = true; return renderForm();
    case 'fCat': F.lines[0].cat = F.lines[0].cat === k ? '' : k; return renderForm();
    case 'fLoan': { F.loan = k; const l = acc(k); if (acc(l.payAcc)) F.acc = l.payAcc; if (!calc(F.amt) && l.pay) F.amt = String(l.pay); const tt = calc(F.amt); if (tt > 0) { const s = loanSplit(l, tt); F.prin = String(s.prin); F.int = String(s.int); } return renderForm(); }
    case 'sAdd': F.lines.push({ledger: F.lines[0].ledger === 'co' ? 'me' : 'co', cat: '', amt: '', inv: false}); return renderForm();
    case 'sDel': F.lines.splice(+el.dataset.i, 1); return renderForm();
    case 'fSave': return saveTx();
    case 'fDel': if (confirm('確定刪除這筆紀錄？')) { S.txs = S.txs.filter(x => x.id !== F.id); save(); closeSheet(); render(); toast('已刪除'); } return;
    // 設定
    case 'accNew': return openAcc();
    case 'accEdit': return openAcc(acc(id));
    case 'accSave': return saveAcc(id);
    case 'accDel': if (confirm('刪除這個帳戶？')) { S.accounts = S.accounts.filter(x => x.id !== id); save(); closeSheet(); render(); } return;
    case 'recNew': return openRec();
    case 'recEdit': return openRec(S.recs.find(r => r.id === id));
    case 'recSave': return saveRec(id);
    case 'recDel': if (confirm('刪除這個定期項目？（已記的帳不受影響）')) { S.recs = S.recs.filter(r => r.id !== id); save(); closeSheet(); render(); } return;
    case 'setL': setL = k; return render();
    case 'setK': setK = k; return render();
    case 'catNew': { const n = prompt(`新增${LN[setL]}${TXT[setK]}分類名稱`); if (n && n.trim()) { S.cats.push({id: uid(), ledger: setL, kind: setK, name: n.trim()}); save(); render(); } return; }
    case 'catEdit': {
      const c = cat(id); const n = prompt(`修改名稱（清空＝${c.hide ? '恢復顯示' : '隱藏'}）`, c.name);
      if (n === null) return;
      if (n.trim()) c.name = n.trim(); else c.hide = !c.hide;
      save(); return render();
    }
    case 'saveOpenX': { const v = calc($('#openX').value); if (Number.isNaN(v)) return toast('金額格式錯誤'); S.openX = v; save(); render(); return toast('已儲存'); }
    case 'export': return exportData();
    case 'import': return $('#impFile').click();
  }
});
document.addEventListener('change', e => { if (e.target.id === 'impFile' && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; } });

render();
if (navigator.onLine) Promise.all([fetchFx(), fetchPrices()]).then(([a, b]) => { if ((a || b) && !F && !$('#sheet').classList.contains('on')) render(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
